name: Recorgi
options:
  bundleIdPrefix: com.recorgi
  deploymentTarget:
    macOS: "26.0"

packages:
  RecorgiCore:
    path: Packages/RecorgiCore
  RecorgiCapture:
    path: Packages/RecorgiCapture
  RecorgiUI:
    path: Packages/RecorgiUI

targets:
  Recorgi:
    type: application
    platform: macOS
    sources:
      - path: Recorgi
    dependencies:
      - package: RecorgiCore
      - package: RecorgiCapture
      - package: RecorgiUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recorgi.app
        PRODUCT_NAME: Recorgi
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        # Hardened Runtime is for notarization/distribution, not local dev —
        # and it enables Library Validation, which breaks Xcode's Debug-
        # configuration "debug dylib" launch trick (main executable is a
        # thin stub that loads the real code from a separate .debug.dylib;
        # the stub is signed by Xcode's own toolchain, not by us, so
        # validation fails once a real — even self-signed — identity is
        # used instead of ad-hoc). Off for local builds; turn back on if
        # this project ever needs to be notarized for distribution.
        ENABLE_HARDENED_RUNTIME: false
        # Self-signed local codesigning identity (no Apple Developer account
        # needed) — keeps the app's code identity stable across rebuilds, so
        # macOS doesn't treat every rebuild as a "new" app and reset TCC
        # grants (mic, screen recording). Create it once via Keychain Access
        # → Certificate Assistant → Create a Certificate… → Self Signed Root
        # / Code Signing, name it exactly "Recorgi Local Dev", then trust it
        # for code signing (double-click it → Trust → Code Signing → Always
        # Trust). See README for the full walkthrough.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Recorgi Local Dev"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Release is for Scripts/make-dmg.sh, not day-to-day dev: it packages
      # a build meant to run on OTHER Macs, which don't have (and can't
      # trust) this machine's local "Recorgi Local Dev" certificate. Ad-hoc
      # signing ("-") needs no certificate at all and is the normal way a
      # small open-source app without an Apple Developer Program membership
      # gets distributed — Gatekeeper will still flag it as unidentified on
      # first launch (there's no notarization without a paid Developer ID),
      # which is why the README walks installers through "Open Anyway".
      configs:
        Release:
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Recorgi/Info.plist
      properties:
        # XcodeGen's own Info.plist generator defaults these two to a
        # hardcoded "1.0"/"1" when they're absent here, silently
        # overwriting MARKETING_VERSION/CURRENT_PROJECT_VERSION above on
        # every `xcodegen generate` — spell them out explicitly so the
        # built app's version actually tracks project.yml.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Recorgi
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: "Recorgi records your microphone when you turn it on as an audio source."
        NSHumanReadableCopyright: "Recorgi contributors. Licensed under GPL-3.0-or-later."
        LSApplicationCategoryType: public.app-category.video
        # Registers Recorgi/Fonts/Unbounded-Bold.ttf (copied into the app
        # bundle's Resources as a plain resource, same as any other
        # non-source file under the target's `sources:` path) process-wide
        # at launch — "." means the bundle's own top-level Resources dir.
        # Lets Font.custom("Unbounded-Bold", ...) resolve anywhere in the
        # process, including RecorgiUI, without that package needing to
        # import or even know about the font file itself.
        ATSApplicationFontsPath: "."
